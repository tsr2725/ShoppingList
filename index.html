<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping List</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #1c1c1e;
            margin: 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 480px;
        }
        h1 {
            font-size: 34px;
            font-weight: 700;
            color: #bfa15f; /* Matches your brownish gold header style */
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }
        .list-card {
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #e5e5ea;
            box-shadow: 0 4px 16px rgba(0,0,0,0.04);
            padding: 20px;
            margin-bottom: 20px;
        }
        .item-row {
            display: flex;
            align-items: center;
            padding: 12px 0;
        }
        /* Apple Reminders style radio/checkbox ring */
        .radio-circle {
            width: 22px;
            height: 22px;
            border: 2px solid #c7c7cc;
            border-radius: 50%;
            margin-right: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .item-name {
            font-size: 18px;
            font-weight: 400;
            color: #000000;
            flex-grow: 1;
        }
        .action-button {
            background-color: #bfa15f;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            margin-top: 16px;
            box-shadow: 0 4px 12px rgba(191, 161, 95, 0.3);
            transition: background-color 0.2s;
        }
        .action-button:active { background-color: #a3874d; }
        .action-button:disabled { background-color: #e5e5ea; color: #8e8e93; box-shadow: none; cursor: not-allowed; }
        .status {
            text-align: center;
            margin-top: 14px;
            font-size: 14px;
            font-weight: 500;
            min-height: 20px;
        }
        .success { color: #34c759; }
        .error { color: #ff3b30; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Shopping</h1>
        
        <div class="list-card">
            <div class="item-row">
                <div class="radio-circle" id="circle"></div>
                <div class="item-name" id="itemText">Loading item...</div>
            </div>
            
            <button id="addBtn" class="action-button" onclick="addItemToGitHub()">Add to List</button>
            <div id="status" class="status"></div>
        </div>
    </div>

    <script>
        // CONFIGURATION: Fill in your GitHub details here
        const GITHUB_USERNAME = "YOUR_GITHUB_USERNAME";
        const REPO_NAME = "YOUR_REPO_NAME";
        const PERSONAL_ACCESS_TOKEN = "YOUR_GITHUB_PAT_TOKEN"; // Classic PAT with 'repo' scope
        const FILE_PATH = "shopping.txt";

        // Read the item from the URL query parameter (e.g. ?item=Apples -> defaults to "Milk")
        const urlParams = new URLSearchParams(window.location.search);
        let itemName = urlParams.get('item') || 'Milk';
        
        // Capitalize nicely for display (e.g., "apples" -> "Apples")
        itemName = itemName.charAt(0).toUpperCase() + itemName.slice(1).toLowerCase();
        
        // Update UI text dynamically
        document.getElementById('itemText').innerText = itemName;
        document.getElementById('addBtn').innerText = `Add ${itemName}`;
        document.title = `Add ${itemName} - Shopping List`;

        async function addItemToGitHub() {
            const btn = document.getElementById('addBtn');
            const status = document.getElementById('status');
            const circle = document.getElementById('circle');

            btn.disabled = true;
            btn.innerText = "Adding...";
            status.innerText = "";

            const apiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`;

            try {
                // 1. Get current file content & SHA
                let sha = "";
                let currentContent = "";
                
                const getRes = await fetch(apiUrl, {
                    headers: { "Authorization": `token ${PERSONAL_ACCESS_TOKEN}` }
                });

                if (getRes.ok) {
                    const fileData = await getRes.json();
                    sha = fileData.sha;
                    currentContent = decodeURIComponent(escape(atob(fileData.content)));
                }

                // 2. Append the dynamic item to the list
                const updatedContent = currentContent + "\n" + itemName;
                const encodedContent = btoa(unescape(encodeURIComponent(updatedContent)));

                // 3. Commit update back to GitHub
                const putRes = await fetch(apiUrl, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${PERSONAL_ACCESS_TOKEN}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: `Add ${itemName} via QR code web app`,
                        content: encodedContent,
                        sha: sha
                    })
                });

                if (putRes.ok) {
                    btn.innerText = "Added!";
                    circle.style.backgroundColor = "#bfa15f"; // Fill circle on success
                    circle.style.borderColor = "#bfa15f";
                    status.className = "status success";
                    status.innerText = `✓ ${itemName} added to your list!`;
                } else {
                    throw new Error("Failed to commit update.");
                }

                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerText = `Add ${itemName}`;
                    circle.style.backgroundColor = "transparent";
                    circle.style.borderColor = "#c7c7cc";
                    status.innerText = "";
                }, 3500);

            } catch (err) {
                console.error(err);
                btn.disabled = false;
                btn.innerText = `Add ${itemName}`;
                status.className = "status error";
                status.innerText = "Error adding item.";
            }
        }
    </script>
</body>
</html>
