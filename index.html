    <!-- Dynamic Theme-Matched Icon Generator -->
    <script>
        function updateDynamicIcon() {
            const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const bgColor = isDark ? '#000000' : '#ffffff';

            const img = new Image();
            img.src = 'logo.png';

            img.onload = function() {
                const canvas = document.createElement('canvas');
                canvas.width = 180;
                canvas.height = 180;
                const ctx = canvas.getContext('2d');

                ctx.fillStyle = bgColor;
                ctx.fillRect(0, 0, 180, 180);

                const maxDim = 132;
                const scale = Math.min(maxDim / img.width, maxDim / img.height);
                const w = img.width * scale;
                const h = img.height * scale;
                const x = (180 - w) / 2;
                const y = (180 - h) / 2;

                ctx.drawImage(img, x, y, w, h);

                const iconUrl = canvas.toDataURL('image/png');

                let appleIcon = document.querySelector('link[rel="apple-touch-icon"]');
                if (!appleIcon) {
                    appleIcon = document.createElement('link');
                    appleIcon.rel = 'apple-touch-icon';
                    document.head.appendChild(appleIcon);
                }
                appleIcon.href = iconUrl;

                let favicon = document.querySelector('link[rel="icon"]');
                if (!favicon) {
                    favicon = document.createElement('link');
                    favicon.rel = 'icon';
                    document.head.appendChild(favicon);
                }
                favicon.href = iconUrl;
            };
        }

        updateDynamicIcon();
        if (window.matchMedia) {
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateDynamicIcon);
        }
    </script>

    <style>

<body>

    <div class="container">

        </div>
        
        <div id="status" class="status"></div>
    </div>

    <button class="fab" onclick="openModal()">+</button>

    <!-- Add Product Modal -->

    <!-- Edit Item Modal -->
    <div class="modal" id="editModal">

                    </select>
                    <button type="button" class="qty-btn" onclick="adjustEditQty(1)">+</button>

            <button class="modal-btn" onclick="saveEditedItem()">Save Changes</button>
            <button class="modal-btn secondary" onclick="closeEditModal()">Cancel</button>
        </div>

    <script>
        const GITHUB_USERNAME = "tsr2725";
        const REPO_NAME = "ShoppingList";
        const FILE_PATH = "shopping.json";
        const POLL_INTERVAL = 1000;

        let PERSONAL_ACCESS_TOKEN = "";

        function getPAT(forceReset = false) {
            if (forceReset) {
                localStorage.removeItem("gh_shopping_pat");
            }
            let token = localStorage.getItem("gh_shopping_pat");
            if (!token) {
                token = prompt("Enter your GitHub Personal Access Token (starts with ghp_ or github_pat_):");
                if (token) {
                    token = token.trim();
                    localStorage.setItem("gh_shopping_pat", token);
                }
            }
            return token;
        }

        const apiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`;
        let html5QrCode = null;
        let currentItems = [];
        let currentSha = "";
        let showCompleted = false;

        let syncTimer = null;
        let pollTimer = null;
        let isSyncing = false;
        let syncPending = false;
        let lastCommitMsg = "Update list";
        let lastLocalActionTime = 0;
        let editingItemId = null;

        const pendingMoveIds = new Set();
        const pendingTimeouts = {};

        let dragSrcIndex = null;
        let touchActiveIndex = null;
        let touchRowElement = null;

        function formatItemName(str) {
            if (!str) return "";
            const trimmed = str.trim();
            return trimmed.charAt(0).toUpperCase() + trimmed.slice(1).toLowerCase();
        }

        function parseItemInput(rawStr) {
            if (!rawStr) return { name: "", quantity: 1 };
            const trimmed = rawStr.trim();
            const match = trimmed.match(/^(.*?)(?:[\s\-_]*x(\d+))$/i);
            
            if (match && match[1].trim()) {
                return {
                    name: formatItemName(match[1]),
                    quantity: parseInt(match[2], 10) || 1
                };
            }
            return {
                name: formatItemName(trimmed),
                quantity: 1
            };
        }

        function decodeContent(b64) {
            const binString = atob(b64.replace(/\s/g, ''));
            const bytes = Uint8Array.from(binString, (m) => m.codePointAt(0));
            return new TextDecoder().decode(bytes);
        }

        function encodeContent(str) {
            const bytes = new TextEncoder().encode(str);
            const binString = Array.from(bytes, (byte) => String.fromCodePoint(byte)).join('');
            return btoa(binString);
        }

        function handleAuthError() {
            alert("Invalid GitHub Token (Bad credentials). Please enter a valid Personal Access Token.");
            PERSONAL_ACCESS_TOKEN = getPAT(true);
            if (PERSONAL_ACCESS_TOKEN) {
                location.reload();
            }
        }

        window.onload = async function() {
            populateQtyDropdown();
            PERSONAL_ACCESS_TOKEN = getPAT();
            if (!PERSONAL_ACCESS_TOKEN) return;

            const urlParams = new URLSearchParams(window.location.search);
            const rawItem = urlParams.get('item');
            
            await fetchListFromGitHub();

            if (rawItem) {
                window.history.replaceState({}, document.title, window.location.pathname);
                await addItem(rawItem);
            }

            startPolling();
        };

        function populateQtyDropdown() {
            const select = document.getElementById('editItemQty');
            select.innerHTML = '';
            for (let i = 1; i <= 99; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `x${i}`;
                select.appendChild(opt);
            }
        }

        function startPolling() {
            if (pollTimer) clearInterval(pollTimer);
            pollTimer = setInterval(pollGitHub, POLL_INTERVAL);
        }

        function stopPolling() {
            if (pollTimer) clearInterval(pollTimer);
            pollTimer = null;
        }

        window.addEventListener("focus", () => {
            pollGitHub();
        });

        document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
                stopPolling();
            } else {
                pollGitHub();
                startPolling();
            }
        });

        async function pollGitHub() {
            if (isSyncing || syncPending || (Date.now() - lastLocalActionTime < 1000) || pendingMoveIds.size > 0) return;

            try {
                const getRes = await fetch(`${apiUrl}?t=${Date.now()}`, {
                    headers: { "Authorization": `Bearer ${PERSONAL_ACCESS_TOKEN}` }
                });

                if (getRes.status === 401) {
                    handleAuthError();
                    return;
                }

                if (getRes.ok) {
                    const fileData = await getRes.json();
                    if (fileData.sha !== currentSha) {
                        currentSha = fileData.sha;
                        const rawContent = decodeContent(fileData.content);
                        currentItems = parseFileContent(rawContent);
                        renderList();
                    }
                }
            } catch (err) { }
        }

        async function fetchListFromGitHub() {
            const statusDiv = document.getElementById('status');
            try {
                const getRes = await fetch(`${apiUrl}?t=${Date.now()}`, {
                    headers: { "Authorization": `Bearer ${PERSONAL_ACCESS_TOKEN}` }
                });

                if (getRes.status === 401) {
                    handleAuthError();
                    return;
                }

                if (getRes.ok) {
                    const fileData = await getRes.json();
                    currentSha = fileData.sha;
                    const rawContent = decodeContent(fileData.content);
                    currentItems = parseFileContent(rawContent);
                } else if (getRes.status === 404) {
                    currentItems = [];
                    currentSha = "";
                }
                renderList();
            } catch (err) {
                console.error(err);
                document.getElementById('loadingText').innerText = "Failed to load list.";
                statusDiv.innerText = "Error syncing with GitHub.";
            }
        }

        function parseFileContent(contentStr) {
            if (!contentStr.trim()) return [];
            try {
                const parsed = JSON.parse(contentStr);
                if (Array.isArray(parsed)) {
                    return parsed.map(item => ({
                        ...item,
                        name: formatItemName(item.name),
                        quantity: parseInt(item.quantity, 10) || 1
                    }));
                }
            } catch (e) {
                return contentStr.split('\n')
                    .map(line => line.trim())
                    .filter(line => line.length > 0)
                    .map(name => {
                        const parsedItem = parseItemInput(name);
                        return {
                            id: 'id-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5),
                            name: parsedItem.name,
                            quantity: parsedItem.quantity,
                            completed: false
                        };
                    });
            }
            return [];
        }

        function scheduleSync(commitMessage = "Update list") {
            lastCommitMsg = commitMessage;
            lastLocalActionTime = Date.now();
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = "Pending sync...";

            if (syncTimer) clearTimeout(syncTimer);
            syncTimer = setTimeout(() => {
                processSyncQueue();
            }, 150);
        }

        async function processSyncQueue() {
            if (isSyncing) {
                syncPending = true;
                return;
            }

            isSyncing = true;
            syncPending = false;
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = "Syncing...";

            try {
                if (!currentSha) {
                    const getRes = await fetch(`${apiUrl}?t=${Date.now()}`, {
                        headers: { "Authorization": `Bearer ${PERSONAL_ACCESS_TOKEN}` }
                    });
                    if (getRes.status === 401) {
                        handleAuthError();
                        isSyncing = false;
                        return;
                    }
                    if (getRes.ok) {
                        const fileData = await getRes.json();
                        currentSha = fileData.sha;
                    }
                }

                const encodedContent = encodeContent(JSON.stringify(currentItems, null, 2));
                const payload = {
                    message: lastCommitMsg,
                    content: encodedContent
                };
                if (currentSha) payload.sha = currentSha;

                const putRes = await fetch(apiUrl, {
                    method: "PUT",
                    headers: {
                        "Authorization": `Bearer ${PERSONAL_ACCESS_TOKEN}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                if (putRes.status === 401) {
                    handleAuthError();
                    isSyncing = false;
                    return;
                }

                if (putRes.ok) {
                    const resData = await putRes.json();
                    currentSha = resData.content.sha;
                    statusDiv.innerText = "✓ Synced";
                    setTimeout(() => { if (statusDiv.innerText === "✓ Synced") statusDiv.innerText = ""; }, 2000);
                } else if (putRes.status === 409 || putRes.status === 422) {
                    currentSha = "";
                    syncPending = true;
                } else {
                    statusDiv.innerText = "Sync error. Retrying...";
                    syncPending = true;
                }
            } catch (err) {
                console.error(err);
                statusDiv.innerText = "Network error syncing with GitHub.";
            } finally {
                isSyncing = false;
                if (syncPending) {
                    syncPending = false;
                    processSyncQueue();
                }
            }
        }

        function toggleShowCompleted() {
            showCompleted = !showCompleted;
            renderList();
        }

        function renderList() {
            const container = document.getElementById('listContainer');
            const clearBtn = document.getElementById('clearBtn');
            container.innerHTML = "";

            const activeItems = currentItems.filter(i => !i.completed || pendingMoveIds.has(i.id));
            const completedItems = currentItems.filter(i => i.completed && !pendingMoveIds.has(i.id));

            clearBtn.disabled = currentItems.filter(i => i.completed).length === 0;

            if (currentItems.length === 0) {
                container.innerHTML = '<div class="empty-state">Your shopping list is empty.</div>';
                return;
            }

            if (activeItems.length === 0 && completedItems.length > 0 && !showCompleted) {
                container.innerHTML = '<div class="empty-state">All items completed! Tap below to view.</div>';
            } else {
                activeItems.forEach((item) => {
                    const realIndex = currentItems.findIndex(i => i.id === item.id);
                    const qtyVal = item.quantity || 1;
                    const qtyHtml = `<span class="qty-badge" onclick="event.stopPropagation(); openEditModal('${item.id}', true)">x${qtyVal}</span>`;
                    const isCompleted = item.completed;
                    
                    const row = document.createElement('div');
                    row.className = 'item-row';
                    row.draggable = true;
                    row.dataset.index = realIndex;
                    
                    row.ondragstart = (e) => handleDragStart(e, realIndex);
                    row.ondragover = (e) => handleDragOver(e, realIndex);
                    row.ondragleave = (e) => handleDragLeave(e);
                    row.ondrop = (e) => handleDrop(e, realIndex);
                    row.ondragend = (e) => handleDragEnd(e);

                    row.innerHTML = `
                        <div class="drag-handle" 
                             ontouchstart="handleTouchStart(event, ${realIndex})" 
                             ontouchmove="handleTouchMove(event)" 
                             ontouchend="handleTouchEnd(event)">⋮⋮</div>
                        <div class="radio-circle ${isCompleted ? 'checked' : ''}" onclick="toggleItem('${item.id}')"></div>
                        <div class="item-name ${isCompleted ? 'completed' : ''}" onclick="openEditModal('${item.id}', false)">${escapeHtml(item.name)}${qtyHtml}</div>
                        <button class="action-btn" onclick="openEditModal('${item.id}')" title="Edit item">✎</button>
                        <button class="action-btn delete-btn" onclick="deleteSingleItem('${item.id}')" title="Delete item">&times;</button>
                    `;
                    container.appendChild(row);
                });
            }

            if (completedItems.length > 0) {
                const header = document.createElement('div');
                header.className = 'completed-section-header';
                header.onclick = toggleShowCompleted;
                header.innerHTML = `
                    <span>Completed (${completedItems.length})</span>
                    <span>${showCompleted ? '▲ Hide' : '▼ Show'}</span>
                `;
                container.appendChild(header);

                if (showCompleted) {
                    completedItems.forEach((item) => {
                        const realIndex = currentItems.findIndex(i => i.id === item.id);
                        const qtyVal = item.quantity || 1;
                        const qtyHtml = `<span class="qty-badge" onclick="event.stopPropagation(); openEditModal('${item.id}', true)">x${qtyVal}</span>`;
                        
                        const row = document.createElement('div');
                        row.className = 'item-row';
                        row.draggable = true;
                        row.dataset.index = realIndex;

                        row.ondragstart = (e) => handleDragStart(e, realIndex);
                        row.ondragover = (e) => handleDragOver(e, realIndex);
                        row.ondragleave = (e) => handleDragLeave(e);
                        row.ondrop = (e) => handleDrop(e, realIndex);
                        row.ondragend = (e) => handleDragEnd(e);

                        row.innerHTML = `
                            <div class="drag-handle" 
                                 ontouchstart="handleTouchStart(event, ${realIndex})" 
                                 ontouchmove="handleTouchMove(event)" 
                                 ontouchend="handleTouchEnd(event)">⋮⋮</div>
                            <div class="radio-circle checked" onclick="toggleItem('${item.id}')"></div>
                            <div class="item-name completed" onclick="openEditModal('${item.id}', false)">${escapeHtml(item.name)}${qtyHtml}</div>
                            <button class="action-btn" onclick="openEditModal('${item.id}')" title="Edit item">✎</button>
                            <button class="action-btn delete-btn" onclick="deleteSingleItem('${item.id}')" title="Delete item">&times;</button>
                        `;
                        container.appendChild(row);
                    });
                }
            }
        }

        function handleDragStart(e, index) {
            dragSrcIndex = index;
            e.dataTransfer.setData('text/plain', index);
            e.currentTarget.classList.add('dragging');
        }

        function handleDragOver(e, index) {
            e.preventDefault();
            const row = e.currentTarget;
            row.classList.add('drag-over');
        }

        function handleDragLeave(e) {
            e.currentTarget.classList.remove('drag-over');
        }

        function handleDrop(e, targetIndex) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            if (dragSrcIndex === null || dragSrcIndex === targetIndex) return;

            const movedItem = currentItems.splice(dragSrcIndex, 1)[0];
            currentItems.splice(targetIndex, 0, movedItem);

            renderList();
            scheduleSync("Reordered shopping list");
        }

        function handleDragEnd(e) {
            e.currentTarget.classList.remove('dragging');
            document.querySelectorAll('.item-row').forEach(r => r.classList.remove('drag-over'));
            dragSrcIndex = null;
        }

        function handleTouchStart(e, index) {
            touchActiveIndex = index;
            touchRowElement = e.currentTarget.closest('.item-row');
            if (touchRowElement) touchRowElement.classList.add('dragging');
        }

        function handleTouchMove(e) {
            if (touchActiveIndex === null) return;
            e.preventDefault();
            const touch = e.touches[0];
            const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
            if (!targetEl) return;
            const targetRow = targetEl.closest('.item-row');
            
            document.querySelectorAll('.item-row').forEach(r => r.classList.remove('drag-over'));
            if (targetRow && targetRow !== touchRowElement) {
                targetRow.classList.add('drag-over');
            }
        }

        function handleTouchEnd(e) {
            if (touchActiveIndex === null) return;
            const touch = e.changedTouches[0];
            const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
            
            if (touchRowElement) touchRowElement.classList.remove('dragging');
            document.querySelectorAll('.item-row').forEach(r => r.classList.remove('drag-over'));

            if (targetEl) {
                const targetRow = targetEl.closest('.item-row');
                if (targetRow && targetRow.dataset.index !== undefined) {
                    const targetIndex = parseInt(targetRow.dataset.index, 10);
                    if (targetIndex !== touchActiveIndex) {
                        const movedItem = currentItems.splice(touchActiveIndex, 1)[0];
                        currentItems.splice(targetIndex, 0, movedItem);
                        renderList();
                        scheduleSync("Reordered shopping list");
                    }
                }
            }
            touchActiveIndex = null;
            touchRowElement = null;
        }

        function openEditModal(id, focusQty = false) {
            const item = currentItems.find(i => i.id === id);
            if (!item) return;

            editingItemId = id;
            document.getElementById('editItemName').value = item.name;
            document.getElementById('editItemQty').value = item.quantity || 1;
            document.getElementById('editModal').style.display = 'flex';

            setTimeout(() => {
                if (focusQty) {
                    document.getElementById('editItemQty').focus();
                } else {
                    document.getElementById('editItemName').focus();
                }
            }, 100);
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
            editingItemId = null;
        }

        function adjustEditQty(delta) {
            const select = document.getElementById('editItemQty');
            let current = parseInt(select.value, 10) || 1;
            let newVal = Math.max(1, Math.min(99, current + delta));
            select.value = newVal;
        }

        function saveEditedItem() {
            if (!editingItemId) return;
            const item = currentItems.find(i => i.id === editingItemId);
            if (!item) return;

            const newName = formatItemName(document.getElementById('editItemName').value);
            const newQty = parseInt(document.getElementById('editItemQty').value, 10) || 1;

            if (newName) {
                item.name = newName;
                item.quantity = newQty;
                renderList();
                scheduleSync(`Edit ${item.name}`);
            }
            closeEditModal();
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        async function addItem(rawName) {
            const parsed = parseItemInput(rawName);
            if (!parsed.name) return;

            const newItem = {
                id: 'id-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5),
                name: parsed.name,
                quantity: parsed.quantity,
                completed: false
            };
            currentItems.push(newItem);
            renderList();
            scheduleSync(`Add ${newItem.name} x${newItem.quantity}`);
        }

        function toggleItem(id) {
            const item = currentItems.find(i => i.id === id);
            if (!item) return;

            if (!item.completed) {
                item.completed = true;
                pendingMoveIds.add(id);
                renderList();
                scheduleSync(`Toggle ${item.name}`);

                if (pendingTimeouts[id]) clearTimeout(pendingTimeouts[id]);

                pendingTimeouts[id] = setTimeout(() => {
                    pendingMoveIds.delete(id);
                    delete pendingTimeouts[id];
                    renderList();
                }, 1000);
            } else {
                if (pendingTimeouts[id]) {
                    clearTimeout(pendingTimeouts[id]);
                    delete pendingTimeouts[id];
                }
                pendingMoveIds.delete(id);
                item.completed = false;
                renderList();
                scheduleSync(`Toggle ${item.name}`);
            }
        }

        function deleteSingleItem(id) {
            const item = currentItems.find(i => i.id === id);
            if (!item) return;

            if (pendingTimeouts[id]) {
                clearTimeout(pendingTimeouts[id]);
                delete pendingTimeouts[id];
            }
            pendingMoveIds.delete(id);

            currentItems = currentItems.filter(i => i.id !== id);
            renderList();
            scheduleSync(`Remove ${item.name}`);
        }

        function clearCompletedItems() {
            const completedCount = currentItems.filter(i => i.completed).length;
            if (completedCount === 0) return;

            currentItems = currentItems.filter(i => !i.completed);
            pendingMoveIds.clear();
            Object.keys(pendingTimeouts).forEach(k => {
                clearTimeout(pendingTimeouts[k]);
                delete pendingTimeouts[k];
            });

            renderList();
            scheduleSync(`Clear ${completedCount} completed items`);
        }

        function openModal() {
            document.getElementById('scanModal').style.display = 'flex';
            document.getElementById('manualInput').value = "";
            
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                async (decodedText) => {
                    closeModal();
                    let text = decodedText;
                    if (decodedText.includes("?item=")) {
                        try {
                            const url = new URL(decodedText);
                            text = url.searchParams.get("item") || decodedText;
                        } catch(e) {}
                    }
                    await addItem(text);
                },
                () => {}
            ).catch(err => console.log("Camera inactive or not available", err));
        }

        function closeModal() {
            stopScanner();
            document.getElementById('scanModal').style.display = 'none';
        }

        function stopScanner() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => html5QrCode.clear()).catch(err => console.log(err));
            }
        }

        async function submitManualItem() {
            const val = document.getElementById('manualInput').value;
            if (val && val.trim()) {
                closeModal();
                await addItem(val);
            }
        }
    </script>
</body>
</html>
