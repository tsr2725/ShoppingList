<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping List</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #1c1c1e;
            margin: 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 480px;
        }
        h1 {
            font-size: 34px;
            font-weight: 700;
            color: #bfa15f; /* Apple Reminders brownish gold style */
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }
        .list-card {
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #e5e5ea;
            box-shadow: 0 4px 16px rgba(0,0,0,0.04);
            padding: 10px 20px;
            margin-bottom: 20px;
        }
        .item-row {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f5;
        }
        .item-row:last-child {
            border-bottom: none;
        }
        .radio-circle {
            width: 22px;
            height: 22px;
            border: 2px solid #bfa15f;
            background-color: #bfa15f;
            border-radius: 50%;
            margin-right: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Checkmark icon inside circle */
        .radio-circle::after {
            content: "";
            width: 6px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
            margin-bottom: 2px;
        }
        .item-name {
            font-size: 18px;
            font-weight: 400;
            color: #000000;
            flex-grow: item;
        }
        .status {
            text-align: center;
            margin-top: 14px;
            font-size: 14px;
            font-weight: 500;
            color: #8e8e93;
        }
        .empty-state {
            color: #8e8e93;
            text-align: center;
            padding: 20px 0;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Shopping</h1>
        
        <div class="list-card" id="listContainer">
            <div class="empty-state" id="loadingText">Loading shopping list...</div>
        </div>
        
        <div id="status" class="status"></div>
    </div>

    <script>
        // CONFIGURATION: Fill in your GitHub details here
        const GITHUB_USERNAME = "YOUR_GITHUB_USERNAME";
        const REPO_NAME = "YOUR_REPO_NAME";
        const PERSONAL_ACCESS_TOKEN = "YOUR_GITHUB_PAT_TOKEN"; // Classic PAT with 'repo' scope
        const FILE_PATH = "shopping.txt";

        const apiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`;

        window.onload = async function() {
            const urlParams = new URLSearchParams(window.location.search);
            const rawItem = urlParams.get('item'); // e.g. ?item=apples
            
            let newItem = rawItem ? rawItem.charAt(0).toUpperCase() + rawItem.slice(1).toLowerCase() : null;
            const statusDiv = document.getElementById('status');

            try {
                statusDiv.innerText = newItem ? `Adding ${newItem} to list...` : "Loading list...";

                // 1. Fetch current contents from GitHub
                const getRes = await fetch(apiUrl, {
                    headers: { "Authorization": `token ${PERSONAL_ACCESS_TOKEN}` }
                });

                let sha = "";
                let currentItems = [];

                if (getRes.ok) {
                    const fileData = await getRes.json();
                    sha = fileData.sha;
                    const decoded = decodeURIComponent(escape(atob(fileData.content)));
                    // Split lines into an array and filter out blank lines
                    currentItems = decoded.split('\n').map(i => i.trim()).filter(i => i.length > 0);
                }

                // 2. If a new item was provided in the URL, append it (avoiding strict duplicates if desired, or allow them)
                if (newItem) {
                    currentItems.push(newItem);

                    // 3. Save the updated list back to GitHub immediately
                    const updatedContent = currentItems.join('\n');
                    const encodedContent = btoa(unescape(encodeURIComponent(updatedContent)));

                    const putRes = await fetch(apiUrl, {
                        method: "PUT",
                        headers: {
                            "Authorization": `token ${PERSONAL_ACCESS_TOKEN}`,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            message: `Auto-add ${newItem} via QR scan`,
                            content: encodedContent,
                            sha: sha
                        })
                    });

                    if (putRes.ok) {
                        statusDiv.innerText = `✓ ${newItem} added successfully!`;
                        // Clean the URL parameter so refreshing doesn't re-add the item
                        window.history.replaceState({}, document.title, window.location.pathname);
                    }
                } else {
                    statusDiv.innerText = "";
                }

                // 4. Render the full list onto the UI matching Apple Reminders style
                renderList(currentItems);

            } catch (err) {
                console.error(err);
                document.getElementById('loadingText').innerText = "Failed to load list.";
                statusDiv.innerText = "Error syncing with GitHub.";
            }
        };

        function renderList(items) {
            const container = document.getElementById('listContainer');
            container.innerHTML = "";

            if (items.length === 0) {
                container.innerHTML = '<div class="empty-state">Your shopping list is empty.</div>';
                return;
            }

            items.forEach(item => {
                const row = document.createElement('div');
                row.className = 'item-row';
                
                row.innerHTML = `
                    <div class="radio-circle"></div>
                    <div class="item-name">${item}</div>
                `;
                container.appendChild(row);
            });
        }
    </script>
</body>
</html>
