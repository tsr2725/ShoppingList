<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Shopping List</title>

    <!-- iOS & Android Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Shopping">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

    <!-- Dynamic Solid Icon Generator -->
    <script>
        (function() {
            try {
                const canvas = document.createElement('canvas');
                canvas.width = 180;
                canvas.height = 180;
                const ctx = canvas.getContext('2d');
                
                ctx.fillStyle = '#bfa15f';
                ctx.fillRect(0, 0, 180, 180);

                ctx.font = '100px apple color emoji, segoe ui emoji, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🛒', 90, 96);

                const iconUrl = canvas.toDataURL('image/png');
                
                const appleIcon = document.createElement('link');
                appleIcon.rel = 'apple-touch-icon';
                appleIcon.href = iconUrl;
                document.head.appendChild(appleIcon);

                const favicon = document.createElement('link');
                favicon.rel = 'icon';
                favicon.href = iconUrl;
                document.head.appendChild(favicon);
            } catch(e) { console.error(e); }
        })();
    </script>

    <!-- Html5-Qrcode scanner library -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        :root {
            --bg-color: #ffffff;
            --card-bg: #ffffff;
            --card-border: #e5e5ea;
            --text-color: #1c1c1e;
            --text-muted: #8e8e93;
            --item-border: #f0f0f5;
            --circle-border: #c7c7cc;
            --accent-color: #bfa15f;
            --modal-bg: #ffffff;
            --input-bg: #ffffff;
            --input-border: #c7c7cc;
            --secondary-btn-bg: #e5e5ea;
            --secondary-btn-text: #1c1c1e;
            --delete-hover: #ff3b30;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --card-bg: #1c1c1e;
                --card-border: #2c2c2e;
                --text-color: #f2f2f7;
                --text-muted: #8e8e93;
                --item-border: #2c2c2e;
                --circle-border: #48484a;
                --accent-color: #d4af37;
                --modal-bg: #1c1c1e;
                --input-bg: #2c2c2e;
                --input-border: #3a3a3c;
                --secondary-btn-bg: #2c2c2e;
                --secondary-btn-text: #f2f2f7;
            }
        }

        html {
            background-color: var(--bg-color);
            height: 100%;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 560px;
            padding-bottom: 80px;
            box-sizing: border-box;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 16px;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            color: var(--accent-color);
            margin: 0;
            letter-spacing: -0.5px;
        }

        .clear-btn {
            background: none;
            border: none;
            color: var(--accent-color);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            padding: 6px 10px;
            white-space: nowrap;
            flex-shrink: 0;
            border-radius: 6px;
            transition: background-color 0.2s ease, opacity 0.2s ease;
        }

        .clear-btn:hover:not(:disabled) {
            background-color: rgba(191, 161, 95, 0.12);
        }

        .clear-btn:disabled {
            color: var(--circle-border);
            cursor: default;
            opacity: 0.6;
        }

        .list-card {
            background: var(--card-bg);
            border-radius: 14px;
            border: 1px solid var(--card-border);
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            padding: 8px 22px;
            margin-bottom: 20px;
        }

        .item-row {
            display: flex;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid var(--item-border);
        }

        .item-row:last-child {
            border-bottom: none;
        }

        .radio-circle {
            width: 22px;
            height: 22px;
            border: 2px solid var(--circle-border);
            background-color: transparent;
            border-radius: 50%;
            margin-right: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .radio-circle.checked {
            border-color: var(--accent-color);
            background-color: var(--accent-color);
        }

        .radio-circle.checked::after {
            content: "";
            width: 5px;
            height: 9px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
            margin-bottom: 2px;
        }

        .item-name {
            font-size: 17px;
            line-height: 1.4;
            font-weight: 400;
            color: var(--text-color);
            flex-grow: 1;
            transition: color 0.2s;
            word-break: break-word;
            cursor: pointer;
        }

        .item-name.completed {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--circle-border);
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
            margin-left: 8px;
            border-radius: 4px;
            transition: color 0.2s ease;
        }

        .delete-btn:hover {
            color: var(--delete-hover);
        }

        .completed-section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0 12px 0;
            margin-top: 6px;
            border-top: 1px solid var(--card-border);
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
            transition: color 0.2s ease;
        }

        .completed-section-header:hover {
            color: var(--accent-color);
        }

        .status {
            text-align: center;
            margin-top: 14px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            min-height: 20px;
        }

        .empty-state {
            color: var(--text-muted);
            text-align: center;
            padding: 28px 0;
            font-style: italic;
        }

        .fab {
            position: fixed;
            bottom: calc(30px + env(safe-area-inset-bottom));
            right: calc(30px + env(safe-area-inset-right));
            width: 60px;
            height: 60px;
            background-color: var(--accent-color);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 4px 16px rgba(191, 161, 95, 0.4);
            cursor: pointer;
            border: none;
            transition: transform 0.2s;
            z-index: 99;
        }

        .fab:active { transform: scale(0.95); }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-content {
            background: var(--modal-bg);
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            text-align: center;
        }

        .modal-content h3 { margin-top: 0; color: var(--accent-color); }

        .modal-input {
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            border: 1px solid var(--input-border);
            background: var(--input-bg);
            color: var(--text-color);
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .modal-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }

        .modal-btn.secondary {
            background-color: var(--secondary-btn-bg);
            color: var(--secondary-btn-text);
            margin-top: 10px;
        }

        #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-row">
            <h1>Shopping</h1>
            <button class="clear-btn" id="clearBtn" onclick="clearCompletedItems()" disabled>Clear Completed</button>
        </div>
        
        <div class="list-card" id="listContainer">
            <div class="empty-state" id="loadingText">Loading shopping list...</div>
        </div>
        
        <div id="status" class="status"></div>
    </div>

    <button class="fab" onclick="openModal()">+</button>

    <div class="modal" id="scanModal">
        <div class="modal-content">
            <h3>Add Product</h3>
            <div id="reader"></div>
            <p style="font-size: 14px; color: var(--text-muted); margin: 10px 0;">— OR ENTER MANUALLY —</p>
            <input type="text" id="manualInput" class="modal-input" placeholder="Enter product name (e.g. Bread)" onkeydown="if(event.key==='Enter') submitManualItem()">
            <button class="modal-btn" onclick="submitManualItem()">Add Product</button>
            <button class="modal-btn secondary" onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <script>
        const GITHUB_USERNAME = "tsr2725";
        const REPO_NAME = "ShoppingList";
        const FILE_PATH = "shopping.json";
        const POLL_INTERVAL = 3000; // Check GitHub every 3 seconds for updates

        let PERSONAL_ACCESS_TOKEN = "";

        function getPAT(forceReset = false) {
            if (forceReset) {
                localStorage.removeItem("gh_shopping_pat");
            }
            let token = localStorage.getItem("gh_shopping_pat");
            if (!token) {
                token = prompt("Enter your GitHub Personal Access Token (starts with ghp_ or github_pat_):");
                if (token) {
                    token = token.trim();
                    localStorage.setItem("gh_shopping_pat", token);
                }
            }
            return token;
        }

        const apiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`;
        let html5QrCode = null;
        let currentItems = [];
        let currentSha = "";
        let showCompleted = false;

        let syncTimer = null;
        let pollTimer = null;
        let isSyncing = false;
        let syncPending = false;
        let lastCommitMsg = "Update list";
        let lastLocalActionTime = 0;

        function formatItemName(str) {
            if (!str) return "";
            const trimmed = str.trim();
            return trimmed.charAt(0).toUpperCase() + trimmed.slice(1).toLowerCase();
        }

        function decodeContent(b64) {
            const binString = atob(b64.replace(/\s/g, ''));
            const bytes = Uint8Array.from(binString, (m) => m.codePointAt(0));
            return new TextDecoder().decode(bytes);
        }

        function encodeContent(str) {
            const bytes = new TextEncoder().encode(str);
            const binString = Array.from(bytes, (byte) => String.fromCodePoint(byte)).join('');
            return btoa(binString);
        }

        function handleAuthError() {
            alert("Invalid GitHub Token (Bad credentials). Please enter a valid Personal Access Token.");
            PERSONAL_ACCESS_TOKEN = getPAT(true);
            if (PERSONAL_ACCESS_TOKEN) {
                location.reload();
            }
        }

        window.onload = async function() {
            PERSONAL_ACCESS_TOKEN = getPAT();
            if (!PERSONAL_ACCESS_TOKEN) return;

            const urlParams = new URLSearchParams(window.location.search);
            const rawItem = urlParams.get('item');
            
            await fetchListFromGitHub();

            if (rawItem) {
                window.history.replaceState({}, document.title, window.location.pathname);
                await addItem(rawItem);
            }

            startPolling();
        };

        // Real-time background sync polling
        function startPolling() {
            if (pollTimer) clearInterval(pollTimer);
            pollTimer = setInterval(pollGitHub, POLL_INTERVAL);
        }

        function stopPolling() {
            if (pollTimer) clearInterval(pollTimer);
            pollTimer = null;
        }

        // Auto pause polling on tab blur to save battery/bandwidth
        document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
                stopPolling();
            } else {
                pollGitHub();
                startPolling();
            }
        });

        async function pollGitHub() {
            // Pause polling while local user updates are actively pushing or queued
            if (isSyncing || syncPending || (Date.now() - lastLocalActionTime < 1500)) return;

            try {
                const getRes = await fetch(`${apiUrl}?t=${Date.now()}`, {
                    headers: { "Authorization": `Bearer ${PERSONAL_ACCESS_TOKEN}` }
                });

                if (getRes.status === 401) {
                    handleAuthError();
                    return;
                }

                if (getRes.ok) {
                    const fileData = await getRes.json();
                    if (fileData.sha !== currentSha) {
                        currentSha = fileData.sha;
                        const rawContent = decodeContent(fileData.content);
                        currentItems = parseFileContent(rawContent);
                        renderList();
                    }
                }
            } catch (err) {
                // Background poll network errors fail silently
            }
        }

        async function fetchListFromGitHub() {
            const statusDiv = document.getElementById('status');
            try {
                const getRes = await fetch(`${apiUrl}?t=${Date.now()}`, {
                    headers: { "Authorization": `Bearer ${PERSONAL_ACCESS_TOKEN}` }
                });

                if (getRes.status === 401) {
                    handleAuthError();
                    return;
                }

                if (getRes.ok) {
                    const fileData = await getRes.json();
                    currentSha = fileData.sha;
                    const rawContent = decodeContent(fileData.content);
                    currentItems = parseFileContent(rawContent);
                } else if (getRes.status === 404) {
                    currentItems = [];
                    currentSha = "";
                }
                renderList();
            } catch (err) {
                console.error(err);
                document.getElementById('loadingText').innerText = "Failed to load list.";
                statusDiv.innerText = "Error syncing with GitHub.";
            }
        }

        function parseFileContent(contentStr) {
            if (!contentStr.trim()) return [];
            try {
                const parsed = JSON.parse(contentStr);
                if (Array.isArray(parsed)) {
                    return parsed.map(item => ({ ...item, name: formatItemName(item.name) }));
                }
            } catch (e) {
                return contentStr.split('\n')
                    .map(line => line.trim())
                    .filter(line => line.length > 0)
                    .map(name => ({
                        id: 'id-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5),
                        name: formatItemName(name),
                        completed: false
                    }));
            }
            return [];
        }

        function scheduleSync(commitMessage = "Update list") {
            lastCommitMsg = commitMessage;
            lastLocalActionTime = Date.now();
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = "Pending sync...";

            if (syncTimer) clearTimeout(syncTimer);
            syncTimer = setTimeout(() => {
                processSyncQueue();
            }, 400);
        }

        async function processSyncQueue() {
            if (isSyncing) {
                syncPending = true;
                return;
            }

            isSyncing = true;
            syncPending = false;
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = "Syncing...";

            try {
                if (!currentSha) {
                    const getRes = await fetch(`${apiUrl}?t=${Date.now()}`, {
                        headers: { "Authorization": `Bearer ${PERSONAL_ACCESS_TOKEN}` }
                    });
                    if (getRes.status === 401) {
                        handleAuthError();
                        isSyncing = false;
                        return;
                    }
                    if (getRes.ok) {
                        const fileData = await getRes.json();
                        currentSha = fileData.sha;
                    }
                }

                const encodedContent = encodeContent(JSON.stringify(currentItems, null, 2));
                const payload = {
                    message: lastCommitMsg,
                    content: encodedContent
                };
                if (currentSha) payload.sha = currentSha;

                const putRes = await fetch(apiUrl, {
                    method: "PUT",
                    headers: {
                        "Authorization": `Bearer ${PERSONAL_ACCESS_TOKEN}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                if (putRes.status === 401) {
                    handleAuthError();
                    isSyncing = false;
                    return;
                }

                if (putRes.ok) {
                    const resData = await putRes.json();
                    currentSha = resData.content.sha;
                    statusDiv.innerText = "✓ Synced";
                    setTimeout(() => { if (statusDiv.innerText === "✓ Synced") statusDiv.innerText = ""; }, 2000);
                } else if (putRes.status === 409 || putRes.status === 422) {
                    currentSha = "";
                    syncPending = true;
                } else {
                    statusDiv.innerText = "Sync error. Retrying...";
                    syncPending = true;
                }
            } catch (err) {
                console.error(err);
                statusDiv.innerText = "Network error syncing with GitHub.";
            } finally {
                isSyncing = false;
                if (syncPending) {
                    syncPending = false;
                    processSyncQueue();
                }
            }
        }

        function toggleShowCompleted() {
            showCompleted = !showCompleted;
            renderList();
        }

        function renderList() {
            const container = document.getElementById('listContainer');
            const clearBtn = document.getElementById('clearBtn');
            container.innerHTML = "";

            const activeItems = currentItems.filter(i => !i.completed);
            const completedItems = currentItems.filter(i => i.completed);

            clearBtn.disabled = completedItems.length === 0;

            if (currentItems.length === 0) {
                container.innerHTML = '<div class="empty-state">Your shopping list is empty.</div>';
                return;
            }

            if (activeItems.length === 0 && completedItems.length > 0 && !showCompleted) {
                container.innerHTML = '<div class="empty-state">All items completed! Tap below to view.</div>';
            } else {
                activeItems.forEach((item) => {
                    const row = document.createElement('div');
                    row.className = 'item-row';
                    
                    row.innerHTML = `
                        <div class="radio-circle" onclick="toggleItem('${item.id}')"></div>
                        <div class="item-name" onclick="toggleItem('${item.id}')">${escapeHtml(item.name)}</div>
                        <button class="delete-btn" onclick="deleteSingleItem('${item.id}')" title="Delete item">&times;</button>
                    `;
                    container.appendChild(row);
                });
            }

            if (completedItems.length > 0) {
                const header = document.createElement('div');
                header.className = 'completed-section-header';
                header.onclick = toggleShowCompleted;
                header.innerHTML = `
                    <span>Completed (${completedItems.length})</span>
                    <span>${showCompleted ? '▲ Hide' : '▼ Show'}</span>
                `;
                container.appendChild(header);

                if (showCompleted) {
                    completedItems.forEach((item) => {
                        const row = document.createElement('div');
                        row.className = 'item-row';
                        
                        row.innerHTML = `
                            <div class="radio-circle checked" onclick="toggleItem('${item.id}')"></div>
                            <div class="item-name completed" onclick="toggleItem('${item.id}')">${escapeHtml(item.name)}</div>
                            <button class="delete-btn" onclick="deleteSingleItem('${item.id}')" title="Delete item">&times;</button>
                        `;
                        container.appendChild(row);
                    });
                }
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        async function addItem(rawName) {
            const name = formatItemName(rawName);
            if (!name) return;
            const newItem = {
                id: 'id-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5),
                name: name,
                completed: false
            };
            currentItems.push(newItem);
            renderList();
            scheduleSync(`Add ${newItem.name}`);
        }

        function toggleItem(id) {
            const item = currentItems.find(i => i.id === id);
            if (!item) return;

            item.completed = !item.completed;
            renderList();
            scheduleSync(`Toggle ${item.name}`);
        }

        function deleteSingleItem(id) {
            const item = currentItems.find(i => i.id === id);
            if (!item) return;

            currentItems = currentItems.filter(i => i.id !== id);
            renderList();
            scheduleSync(`Remove ${item.name}`);
        }

        function clearCompletedItems() {
            const completedCount = currentItems.filter(i => i.completed).length;
            if (completedCount === 0) return;

            currentItems = currentItems.filter(i => !i.completed);
            renderList();
            scheduleSync(`Clear ${completedCount} completed items`);
        }

        function openModal() {
            document.getElementById('scanModal').style.display = 'flex';
            document.getElementById('manualInput').value = "";
            
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                async (decodedText) => {
                    closeModal();
                    let text = decodedText;
                    if (decodedText.includes("?item=")) {
                        try {
                            const url = new URL(decodedText);
                            text = url.searchParams.get("item") || decodedText;
                        } catch(e) {}
                    }
                    await addItem(text);
                },
                () => {}
            ).catch(err => console.log("Camera inactive or not available", err));
        }

        function closeModal() {
            stopScanner();
            document.getElementById('scanModal').style.display = 'none';
        }

        function stopScanner() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => html5QrCode.clear()).catch(err => console.log(err));
            }
        }

        async function submitManualItem() {
            const val = document.getElementById('manualInput').value;
            if (val && val.trim()) {
                closeModal();
                await addItem(val);
            }
        }
    </script>
</body>
</html>
