<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping</title>
    <!-- Html5-Qrcode scanner library -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #1c1c1e;
            margin: 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 480px;
            padding-bottom: 80px;
        }
        h1 {
            font-size: 34px;
            font-weight: 700;
            color: #bfa15f; /* Apple Reminders brownish gold style */
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }
        .list-card {
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #e5e5ea;
            box-shadow: 0 4px 16px rgba(0,0,0,0.04);
            padding: 10px 20px;
            margin-bottom: 20px;
        }
        .item-row {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f5;
        }
        .item-row:last-child {
            border-bottom: none;
        }
        /* Unchecked Apple Reminders style circle */
        .radio-circle {
            width: 22px;
            height: 22px;
            border: 2px solid #c7c7cc;
            background-color: transparent;
            border-radius: 50%;
            margin-right: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        /* Checked state when user taps to complete */
        .radio-circle.checked {
            border-color: #bfa15f;
            background-color: #bfa15f;
        }
        .radio-circle.checked::after {
            content: "";
            width: 6px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
            margin-bottom: 2px;
        }
        .item-name {
            font-size: 18px;
            font-weight: 400;
            color: #000000;
            transition: color 0.2s;
        }
        .item-name.completed {
            text-decoration: line-through;
            color: #8e8e93;
        }
        .status {
            text-align: center;
            margin-top: 14px;
            font-size: 14px;
            font-weight: 500;
            color: #8e8e93;
        }
        .empty-state {
            color: #8e8e93;
            text-align: center;
            padding: 20px 0;
            font-style: italic;
        }
        /* Floating Action Button */
        .fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background-color: #bfa15f;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 4px 16px rgba(191, 161, 95, 0.4);
            cursor: pointer;
            border: none;
            transition: transform 0.2s;
        }
        .fab:active { transform: scale(0.95); }

        /* Modal Overlay for Scanner / Manual Entry */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            text-align: center;
        }
        .modal-content h3 { margin-top: 0; color: #bfa15f; }
        .modal-input {
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            border: 1px solid #c7c7cc;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .modal-btn {
            background-color: #bfa15f;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }
        .modal-btn.secondary {
            background-color: #e5e5ea;
            color: #1c1c1e;
            margin-top: 10px;
        }
        #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Shopping</h1>
        
        <div class="list-card" id="listContainer">
            <div class="empty-state" id="loadingText">Loading shopping list...</div>
        </div>
        
        <div id="status" class="status"></div>
    </div>

    <!-- Floating Action Button -->
    <button class="fab" onclick="openModal()">+</button>

    <!-- Scanner / Manual Entry Modal -->
    <div class="modal" id="scanModal">
        <div class="modal-content">
            <h3>Scan Another Product</h3>
            <div id="reader"></div>
            <p style="font-size: 14px; color: #8e8e93; margin: 10px 0;">— OR ENTER MANUALLY —</p>
            <input type="text" id="manualInput" class="modal-input" placeholder="Enter product name (e.g. Bread)">
            <button class="modal-btn" onclick="submitManualItem()">Add Product</button>
            <button class="modal-btn secondary" onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <script>
        // CONFIGURATION: Fill in your GitHub details here
        const GITHUB_USERNAME = "YOUR_GITHUB_USERNAME";
        const REPO_NAME = "YOUR_REPO_NAME";
        const PERSONAL_ACCESS_TOKEN = "YOUR_GITHUB_PAT_TOKEN"; // Classic PAT with 'repo' scope
        const FILE_PATH = "shopping.txt";

        const apiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`;
        let html5QrCode = null;

        window.onload = async function() {
            const urlParams = new URLSearchParams(window.location.search);
            const rawItem = urlParams.get('item'); // e.g. ?item=apples or ?item=bread
            
            let newItem = rawItem ? rawItem.charAt(0).toUpperCase() + rawItem.slice(1).toLowerCase() : null;
            const statusDiv = document.getElementById('status');

            try {
                statusDiv.innerText = newItem ? `Adding ${newItem} to list...` : "";

                // 1. Fetch current contents from GitHub
                const getRes = await fetch(apiUrl, {
                    headers: { "Authorization": `token ${PERSONAL_ACCESS_TOKEN}` }
                });

                let sha = "";
                let currentItems = [];

                if (getRes.ok) {
                    const fileData = await getRes.json();
                    sha = fileData.sha;
                    const decoded = decodeURIComponent(escape(atob(fileData.content)));
                    currentItems = decoded.split('\n').map(i => i.trim()).filter(i => i.length > 0);
                }

                // 2. If a new item is in the URL, append it below existing items
                if (newItem) {
                    currentItems.push(newItem);

                    // 3. Save the updated list back to GitHub immediately
                    const updatedContent = currentItems.join('\n');
                    const encodedContent = btoa(unescape(encodeURIComponent(updatedContent)));

                    const putRes = await fetch(apiUrl, {
                        method: "PUT",
                        headers: {
                            "Authorization": `token ${PERSONAL_ACCESS_TOKEN}`,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            message: `Auto-add ${newItem} via QR scan`,
                            content: encodedContent,
                            sha: sha
                        })
                    });

                    if (putRes.ok) {
                        statusDiv.innerText = `✓ ${newItem} added!`;
                        // Clear URL parameter so refreshing doesn't duplicate the item
                        window.history.replaceState({}, document.title, window.location.pathname);
                    }
                }

                // 4. Render the full list of previous and current items
                renderList(currentItems);

            } catch (err) {
                console.error(err);
                document.getElementById('loadingText').innerText = "Failed to load list.";
                statusDiv.innerText = "Error syncing with GitHub.";
            }
        };

        function renderList(items) {
            const container = document.getElementById('listContainer');
            container.innerHTML = "";

            if (items.length === 0) {
                container.innerHTML = '<div class="empty-state">Your shopping list is empty.</div>';
                return;
            }

            items.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = 'item-row';
                
                row.innerHTML = `
                    <div class="radio-circle" id="circle-${index}" onclick="completeItem(${index}, '${item.replace(/'/g, "\\'")}')"></div>
                    <div class="item-name" id="name-${index}">${item}</div>
                `;
                container.appendChild(row);
            });
        }

        // Handle ticking/completing an item
        async function completeItem(index, itemName) {
            const circle = document.getElementById(`circle-${index}`);
            const nameEl = document.getElementById(`name-${index}`);

            // Apply visual check effect immediately
            circle.classList.add('checked');
            nameEl.classList.add('completed');
            document.getElementById('status').innerText = `Completing ${itemName}...`;

            try {
                // Fetch latest file content & sha to avoid conflicts
                const getRes = await fetch(apiUrl, {
                    headers: { "Authorization": `token ${PERSONAL_ACCESS_TOKEN}` }
                });
                if (!getRes.ok) return;
                const fileData = await getRes.json();
                let currentItems = decodeURIComponent(escape(atob(fileData.content)))
                    .split('\n').map(i => i.trim()).filter(i => i.length > 0);

                // Remove the completed item from the array
                currentItems.splice(index, 1);

                const updatedContent = currentItems.join('\n');
                const encodedContent = btoa(unescape(encodeURIComponent(updatedContent)));

                const putRes = await fetch(apiUrl, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${PERSONAL_ACCESS_TOKEN}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: `Complete and remove ${itemName}`,
                        content: encodedContent,
                        sha: fileData.sha
                    })
                });

                if (putRes.ok) {
                    document.getElementById('status').innerText = "";
                    setTimeout(() => renderList(currentItems), 300);
                }
            } catch (err) {
                console.error(err);
                document.getElementById('status').innerText = "Error updating list.";
            }
        }

        // Modal & Camera Scanner Handling
        function openModal() {
            document.getElementById('scanModal').style.display = 'flex';
            
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText) => {
                    stopScanner();
                    if (decodedText.startsWith('http')) {
                        window.location.href = decodedText;
                    } else {
                        window.location.href = window.location.pathname + "?item=" + encodeURIComponent(decodedText);
                    }
                },
                (errorMessage) => { /* scanning... */ }
            ).catch(err => {
                console.log("Camera access error or not supported", err);
            });
        }

        function closeModal() {
            stopScanner();
            document.getElementById('scanModal').style.display = 'none';
        }

        function stopScanner() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    html5QrCode.clear();
                }).catch(err => console.log(err));
            }
        }

        function submitManualItem() {
            const val = document.getElementById('manualInput').value.trim();
            if (val) {
                stopScanner();
                window.location.href = window.location.pathname + "?item=" + encodeURIComponent(val);
            }
        }
    </script>
</body>
</html>
