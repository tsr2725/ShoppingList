<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping List</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛒</text></svg>">
    <!-- Html5-Qrcode scanner library -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #1c1c1e;
            margin: 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 480px;
            padding-bottom: 80px;
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 34px;
            font-weight: 700;
            color: #bfa15f;
            margin: 0;
            letter-spacing: -0.5px;
        }
        .clear-btn {
            background: none;
            border: none;
            color: #bfa15f;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            padding: 4px 8px;
        }
        .clear-btn:disabled {
            color: #c7c7cc;
            cursor: default;
        }
        .list-card {
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #e5e5ea;
            box-shadow: 0 4px 16px rgba(0,0,0,0.04);
            padding: 4px 16px;
            margin-bottom: 20px;
        }
        .item-row {
            display: flex;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid #f0f0f5;
        }
        .item-row:last-child {
            border-bottom: none;
        }
        .radio-circle {
            width: 22px;
            height: 22px;
            border: 2px solid #c7c7cc;
            background-color: transparent;
            border-radius: 50%;
            margin-right: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .radio-circle.checked {
            border-color: #bfa15f;
            background-color: #bfa15f;
        }
        .radio-circle.checked::after {
            content: "";
            width: 5px;
            height: 9px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
            margin-bottom: 2px;
        }
        .item-name {
            font-size: 17px;
            font-weight: 400;
            color: #000000;
            flex-grow: 1;
            transition: color 0.2s;
            word-break: break-word;
            cursor: pointer;
        }
        .item-name.completed {
            text-decoration: line-through;
            color: #8e8e93;
        }
        .delete-btn {
            background: none;
            border: none;
            color: #c7c7cc;
            font-size: 18px;
            cursor: pointer;
            padding: 0 4px;
            margin-left: 8px;
        }
        .delete-btn:hover {
            color: #ff3b30;
        }
        .completed-section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0 10px 0;
            margin-top: 6px;
            border-top: 1px solid #e5e5ea;
            font-size: 14px;
            font-weight: 600;
            color: #8e8e93;
            cursor: pointer;
            user-select: none;
            transition: color 0.2s ease;
        }
        .completed-section-header:hover {
            color: #bfa15f;
        }
        .status {
            text-align: center;
            margin-top: 14px;
            font-size: 14px;
            font-weight: 500;
            color: #8e8e93;
            min-height: 20px;
        }
        .empty-state {
            color: #8e8e93;
            text-align: center;
            padding: 24px 0;
            font-style: italic;
        }
        .fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background-color: #bfa15f;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 4px 16px rgba(191, 161, 95, 0.4);
            cursor: pointer;
            border: none;
            transition: transform 0.2s;
        }
        .fab:active { transform: scale(0.95); }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            text-align: center;
        }
        .modal-content h3 { margin-top: 0; color: #bfa15f; }
        .modal-input {
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            border: 1px solid #c7c7cc;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .modal-btn {
            background-color: #bfa15f;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }
        .modal-btn.secondary {
            background-color: #e5e5ea;
            color: #1c1c1e;
            margin-top: 10px;
        }
        #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-row">
            <h1>Shopping</h1>
            <button class="clear-btn" id="clearBtn" onclick="clearCompletedItems()" disabled>Clear Completed</button>
        </div>
        
        <div class="list-card" id="listContainer">
            <div class="empty-state" id="loadingText">Loading shopping list...</div>
        </div>
        
        <div id="status" class="status"></div>
    </div>

    <button class="fab" onclick="openModal()">+</button>

    <div class="modal" id="scanModal">
        <div class="modal-content">
            <h3>Add Product</h3>
            <div id="reader"></div>
            <p style="font-size: 14px; color: #8e8e93; margin: 10px 0;">— OR ENTER MANUALLY —</p>
            <input type="text" id="manualInput" class="modal-input" placeholder="Enter product name (e.g. Bread)" onkeydown="if(event.key==='Enter') submitManualItem()">
            <button class="modal-btn" onclick="submitManualItem()">Add Product</button>
            <button class="modal-btn secondary" onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <script>
        const GITHUB_USERNAME = "tsr2725";
        const REPO_NAME = "ShoppingList";
        const FILE_PATH = "shopping.json";

        function getPAT(forceReset = false) {
            if (forceReset) {
                localStorage.removeItem("gh_shopping_pat");
            }
            let token = localStorage.getItem("gh_shopping_pat");
            if (!token) {
                token = prompt("Enter your GitHub Personal Access Token (starts with ghp_ or github_pat_):");
                if (token) {
                    token = token.trim();
                    localStorage.setItem("gh_shopping_pat", token);
                }
            }
            return token;
        }

        let PERSONAL_ACCESS_TOKEN = getPAT();

        const apiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`;
        let html5QrCode = null;
        let currentItems = [];
        let currentSha = "";
        let showCompleted = false; // Toggle state for showing/hiding completed items

        function decodeContent(b64) {
            const binString = atob(b64.replace(/\s/g, ''));
            const bytes = Uint8Array.from(binString, (m) => m.codePointAt(0));
            return new TextDecoder().decode(bytes);
        }

        function encodeContent(str) {
            const bytes = new TextEncoder().encode(str);
            const binString = Array.from(bytes, (byte) => String.fromCodePoint(byte)).join('');
            return btoa(binString);
        }

        function handleAuthError() {
            alert("Invalid GitHub Token (Bad credentials). Please enter a valid Personal Access Token.");
            PERSONAL_ACCESS_TOKEN = getPAT(true);
            if (PERSONAL_ACCESS_TOKEN) {
                location.reload();
            }
        }

        window.onload = async function() {
            const urlParams = new URLSearchParams(window.location.search);
            const rawItem = urlParams.get('item');
            
            await fetchListFromGitHub();

            if (rawItem) {
                const itemToAdd = rawItem.charAt(0).toUpperCase() + rawItem.slice(1).toLowerCase();
                window.history.replaceState({}, document.title, window.location.pathname);
                await addItem(itemToAdd);
            }
        };

        async function fetchListFromGitHub() {
            const statusDiv = document.getElementById('status');
            try {
                const getRes = await fetch(`${apiUrl}?t=${Date.now()}`, {
                    headers: { "Authorization": `Bearer ${PERSONAL_ACCESS_TOKEN}` }
                });

                if (getRes.status === 401) {
                    handleAuthError();
                    return;
                }

                if (getRes.ok) {
                    const fileData = await getRes.json();
                    currentSha = fileData.sha;
                    const rawContent = decodeContent(fileData.content);
                    currentItems = parseFileContent(rawContent);
                } else if (getRes.status === 404) {
                    currentItems = [];
                    currentSha = "";
                }
                renderList();
            } catch (err) {
                console.error(err);
                document.getElementById('loadingText').innerText = "Failed to load list.";
                statusDiv.innerText = "Error syncing with GitHub.";
            }
        }

        function parseFileContent(contentStr) {
            if (!contentStr.trim()) return [];
            try {
                const parsed = JSON.parse(contentStr);
                if (Array.isArray(parsed)) return parsed;
            } catch (e) {
                return contentStr.split('\n')
                    .map(line => line.trim())
                    .filter(line => line.length > 0)
                    .map(name => ({
                        id: 'id-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5),
                        name: name,
                        completed: false
                    }));
            }
            return [];
        }

        async function saveListToGitHub(commitMessage) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = "Syncing...";

            try {
                const encodedContent = encodeContent(JSON.stringify(currentItems, null, 2));
                const payload = {
                    message: commitMessage,
                    content: encodedContent
                };
                if (currentSha) payload.sha = currentSha;

                const putRes = await fetch(apiUrl, {
                    method: "PUT",
                    headers: {
                        "Authorization": `Bearer ${PERSONAL_ACCESS_TOKEN}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                if (putRes.status === 401) {
                    handleAuthError();
                    return;
                }

                if (putRes.ok) {
                    const resData = await putRes.json();
                    currentSha = resData.content.sha;
                    statusDiv.innerText = "✓ Synced";
                    setTimeout(() => { if (statusDiv.innerText === "✓ Synced") statusDiv.innerText = ""; }, 2000);
                } else {
                    statusDiv.innerText = "Sync failed. Fetching latest...";
                    await fetchListFromGitHub();
                }
            } catch (err) {
                console.error(err);
                statusDiv.innerText = "Network error syncing with GitHub.";
            }
        }

        function toggleShowCompleted() {
            showCompleted = !showCompleted;
            renderList();
        }

        function renderList() {
            const container = document.getElementById('listContainer');
            const clearBtn = document.getElementById('clearBtn');
            container.innerHTML = "";

            const activeItems = currentItems.filter(i => !i.completed);
            const completedItems = currentItems.filter(i => i.completed);

            clearBtn.disabled = completedItems.length === 0;

            if (currentItems.length === 0) {
                container.innerHTML = '<div class="empty-state">Your shopping list is empty.</div>';
                return;
            }

            // Render Active Items
            if (activeItems.length === 0 && completedItems.length > 0 && !showCompleted) {
                container.innerHTML = '<div class="empty-state">All items completed! Tap below to view.</div>';
            } else {
                activeItems.forEach((item) => {
                    const row = document.createElement('div');
                    row.className = 'item-row';
                    
                    row.innerHTML = `
                        <div class="radio-circle" onclick="toggleItem('${item.id}')"></div>
                        <div class="item-name" onclick="toggleItem('${item.id}')">${escapeHtml(item.name)}</div>
                        <button class="delete-btn" onclick="deleteSingleItem('${item.id}')" title="Delete item">&times;</button>
                    `;
                    container.appendChild(row);
                });
            }

            // Render Completed Section if any completed items exist
            if (completedItems.length > 0) {
                const header = document.createElement('div');
                header.className = 'completed-section-header';
                header.onclick = toggleShowCompleted;
                header.innerHTML = `
                    <span>Completed (${completedItems.length})</span>
                    <span>${showCompleted ? '▲ Hide' : '▼ Show'}</span>
                `;
                container.appendChild(header);

                if (showCompleted) {
                    completedItems.forEach((item) => {
                        const row = document.createElement('div');
                        row.className = 'item-row';
                        
                        row.innerHTML = `
                            <div class="radio-circle checked" onclick="toggleItem('${item.id}')"></div>
                            <div class="item-name completed" onclick="toggleItem('${item.id}')">${escapeHtml(item.name)}</div>
                            <button class="delete-btn" onclick="deleteSingleItem('${item.id}')" title="Delete item">&times;</button>
                        `;
                        container.appendChild(row);
                    });
                }
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        async function addItem(name) {
            if (!name.trim()) return;
            const newItem = {
                id: 'id-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5),
                name: name.trim(),
                completed: false
            };
            currentItems.push(newItem);
            renderList();
            await saveListToGitHub(`Add ${newItem.name}`);
        }

        async function toggleItem(id) {
            const item = currentItems.find(i => i.id === id);
            if (!item) return;

            item.completed = !item.completed;
            renderList();
            await saveListToGitHub(`Toggle ${item.name} (${item.completed ? 'completed' : 'active'})`);
        }

        async function deleteSingleItem(id) {
            const item = currentItems.find(i => i.id === id);
            if (!item) return;

            currentItems = currentItems.filter(i => i.id !== id);
            renderList();
            await saveListToGitHub(`Remove ${item.name}`);
        }

        async function clearCompletedItems() {
            const completedCount = currentItems.filter(i => i.completed).length;
            if (completedCount === 0) return;

            currentItems = currentItems.filter(i => !i.completed);
            renderList();
            await saveListToGitHub(`Clear ${completedCount} completed items`);
        }

        function openModal() {
            document.getElementById('scanModal').style.display = 'flex';
            document.getElementById('manualInput').value = "";
            
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                async (decodedText) => {
                    closeModal();
                    let text = decodedText;
                    if (decodedText.includes("?item=")) {
                        const url = new URL(decodedText);
                        text = url.searchParams.get("item") || decodedText;
                    }
                    await addItem(text);
                },
                () => {}
            ).catch(err => console.log("Camera inactive or not available", err));
        }

        function closeModal() {
            stopScanner();
            document.getElementById('scanModal').style.display = 'none';
        }

        function stopScanner() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => html5QrCode.clear()).catch(err => console.log(err));
            }
        }

        async function submitManualItem() {
            const val = document.getElementById('manualInput').value.trim();
            if (val) {
                closeModal();
                await addItem(val);
            }
        }
    </script>
</body>
</html>
